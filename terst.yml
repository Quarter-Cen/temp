
stages:
  - test

# =====================================
# PRD - SHELL RUNNER
# =====================================
test-prd-shell:
  stage: test
  tags:
    - prd-shell-runner
  script:
    - echo "=== PRD SHELL RUNNER ==="
    - echo "Runner = $CI_RUNNER_DESCRIPTION"
    - echo "Runner ID = $CI_RUNNER_ID"
    - hostname
    - whoami
    - cat /etc/os-release
    - echo "PRD SHELL SUCCESS"

# =====================================
# PRD - DOCKER RUNNER
# =====================================
test-prd-docker:
  stage: test
  tags:
    - prd-docker-runner
  image: alpine:3.22
  script:
    - echo "=== PRD DOCKER RUNNER ==="
    - echo "Runner = $CI_RUNNER_DESCRIPTION"
    - echo "Runner ID = $CI_RUNNER_ID"
    - hostname
    - cat /etc/alpine-release
    - echo "PRD DOCKER SUCCESS"

